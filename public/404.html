<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Frikisys - 404 Página no encontrada</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #0f0f0f;
        color: #e5e5e5;
        font-family: 'IBM Plex Mono', monospace;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        max-width: 500px;
        padding: 2rem;
      }
      .error-code {
        font-size: 6rem;
        font-weight: 700;
        color: #2a2a2a;
        line-height: 1;
        margin-bottom: 1rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        color: #e5e5e5;
      }
      p {
        font-size: 0.875rem;
        color: #888888;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.625rem 1.25rem;
        background-color: #1a1a1a;
        color: #e5e5e5;
        text-decoration: none;
        border: 1px solid #2a2a2a;
        font-size: 0.875rem;
        transition: border-color 0.2s, color 0.2s;
      }
      a:hover {
        border-color: #6b7280;
        color: #ffffff;
      }
      .pixel-art {
        width: 4px;
        height: 4px;
        background-color: #6b7280;
        display: inline-block;
        margin: 0 2px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="error-code">404</div>
      <h1>Recurso no encontrado</h1>
      <p>La página que buscas no existe o fue movida. Puede que el enlace esté roto o el artículo haya cambiado de dirección.</p>
      <a href="/">← Volver al inicio</a>
      <div style="margin-top: 3rem;">
        <span class="pixel-art"></span>
        <span class="pixel-art"></span>
        <span class="pixel-art"></span>
        <span class="pixel-art"></span>
        <span class="pixel-art"></span>
      </div>
    </div>
  </body>
</html>

    audit_sample_rate: 0.0
tasks:
  - id: landing-page
    title: 'Crear landing page con hero y estadísticas'
    prompt: |
      Crea una landing page impactante para Frikisys en C:\Users\Tirso\.minimax-agent\projects\sysops-wiki\src\components\Landing.tsx
      

         - Subtítulo: "La wiki que los SysAdmins merecemos"
         - Descripción: "Documentación práctica, comandos esenciales y guías de troubleshooting para profesionales de infraestructura Linux y virtualización."
         - 2 CTAs: "Explorar Linux" y "Explorar Virtualización"
      
      2. Estadísticas (contadores animados):
         - 17 artículos
         - 2 categorías
